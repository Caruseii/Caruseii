<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Caruseii, Full Stack e Design" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
 
  <rect x="1" y="1" width="898" height="338" rx="22" fill="#0e1116" stroke="#242c3a" stroke-width="2"/>
  <circle cx="470" cy="270" r="170" fill="url(#glowP)"/>
  <circle cx="780" cy="90" r="190" fill="url(#glowB)"/>
 
  <!-- texto -->
  <text x="52" y="152" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="64" font-weight="800" fill="#e8ecf3" letter-spacing="-1">Caruseii</text>
  <text x="54" y="196" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="26" font-weight="600" fill="url(#sub)">Full Stack e Design</text>
  <text x="54" y="238" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="16" fill="#8b95a7">Desenho a interface e escrevo o código dela.</text>
  <text x="54" y="262" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="14" fill="#5d6778">Estudante na EBAC, Santa Catarina</text>
 
  <!-- janela de código -->
  <g>
    <rect x="500" y="40" width="360" height="190" rx="14" fill="#131a24" stroke="#2a3444" stroke-width="1.5"/>
    <circle cx="522" cy="58" r="5" fill="#ff5f57"/>
    <circle cx="540" cy="58" r="5" fill="#febc2e"/>
    <circle cx="558" cy="58" r="5" fill="#28c840"/>
    <text x="700" y="62" font-family="Consolas, 'Cascadia Code', monospace" font-size="12" fill="#5d6778" text-anchor="middle">botao.html</text>
    <line x1="500" y1="76" x2="860" y2="76" stroke="#232c3a"/>
 
    <g font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="14" fill="#c9d3e3">
      <text x="522" y="100" opacity="0"><tspan fill="#7ab0ff">&lt;button</tspan> <tspan fill="#c9d3e3">class=</tspan><tspan fill="#ffa8d0">"cta"</tspan><tspan fill="#7ab0ff">&gt;</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/></text>
      <text x="522" y="120" opacity="0">  Falar comigo
        <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/></text>
      <text x="522" y="140" opacity="0"><tspan fill="#7ab0ff">&lt;/button&gt;</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/></text>
      <text x="522" y="166" opacity="0"><tspan fill="#ffd479">.cta</tspan> {
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.4s" fill="freeze"/></text>
      <text x="522" y="186" opacity="0">  <tspan fill="#9fb4d6">background:</tspan> <tspan fill="#ff4fa3">#ff4fa3</tspan>;
        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/></text>
      <text x="522" y="206" opacity="0">  <tspan fill="#9fb4d6">border-radius:</tspan> <tspan fill="#ffa8d0">22px</tspan>;
        <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/></text>
      <text x="522" y="226" opacity="0">}
        <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/></text>
    </g>
    <rect x="534" y="214" width="8" height="15" fill="#4f8cff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="3.9s" repeatCount="indefinite"/>
    </rect>
  </g>
 
  <!-- quadro de design (estilo Figma) -->
  <g>
    <rect x="440" y="236" width="220" height="92" rx="10" fill="#1a2030" stroke="#ff4fa3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="448" y="231" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="11" fill="#ff8fc4">Botão</text>
 
    <rect x="470" y="258" width="160" height="44" rx="22" fill="#ff4fa3"/>
    <text x="550" y="286" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="16" font-weight="700" fill="#0e1116">Falar comigo</text>
 
    <!-- seleção -->
    <rect x="470" y="258" width="160" height="44" rx="22" fill="none" stroke="#4f8cff" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#4f8cff" stroke-width="1.5">
      <rect x="466" y="254" width="8" height="8"/>
      <rect x="626" y="254" width="8" height="8"/>
      <rect x="466" y="298" width="8" height="8"/>
      <rect x="626" y="298" width="8" height="8"/>
    </g>
    <rect x="520" y="310" width="60" height="16" rx="4" fill="#4f8cff"/>
    <text x="550" y="322" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ffffff">160 × 44</text>
 
    <!-- cursor -->
    <path d="M0 0 L0 16 L4.5 12 L7.5 19 L10 18 L7 11 L13 11 Z" fill="#ffffff" stroke="#0e1116" stroke-width="1" transform="translate(612 284)">
      <animateTransform attributeName="transform" type="translate" values="640 300;612 284" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </path>
  </g>
</svg>
 
