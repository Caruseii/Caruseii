<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#1a0b30"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="896" height="216" rx="24" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>

  <circle cx="120" cy="60" r="5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="35" r="4" fill="#c084fc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="70" r="4" fill="#a855f7">
    <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="170" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="170" r="3" fill="#c084fc">
    <animate attributeName="opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#e2e8f0" letter-spacing="3">CARUSEI</text>
  <text x="450" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#38bdf8" letter-spacing="6">FULL STACK DEVELOPER &amp; DESIGNER</text>
  <text x="450" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#a5b4fc" letter-spacing="3">HTML • CSS • JAVASCRIPT • REACT • NODE • FIGMA</text>
</svg>
